<!DOCTYPE html>
<html>
<head><title>Debug Scroll Position</title></head>
<body>
<h2>当前保存的滚动位置：</h2>
<pre id="output"></pre>
<script>
const data = localStorage.getItem('popup-scroll-position');
if (data) {
  const parsed = JSON.parse(data);
  document.getElementById('output').textContent = JSON.stringify(parsed, null, 2);
} else {
  document.getElementById('output').textContent = '(无数据)';
}
</script>
</body>
</html>
